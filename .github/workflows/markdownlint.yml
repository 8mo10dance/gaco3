name: Markdown lint

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - '.markdownlint-cli2.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/markdownlint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:docs
