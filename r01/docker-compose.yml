x-references:
  mysql: &mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: rails_app_user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: r01

services:
  rails:
    build: .
    volumes:
      - ${PWD}:/rails
      - bundle:/usr/local/bundle
    ports:
      - '3000:3000'
    environment:
      MYSQL_USER: rails_app_user
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
    command: bash -lc "rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0 -p 3000"
    depends_on:
      mysql:
        condition: service_started
      mysql_test:
        condition: service_started
      terraform:
        condition: service_completed_successfully
  floci:
    image: floci/floci:latest-compat
    ports:
      - '4566:4566'
    environment:
      QUARKUS_LOG_LEVEL: DEBUG
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  terraform:
    image: hashicorp/terraform:1.14.0
    working_dir: /terraform
    volumes:
      - ./terraform:/terraform
    entrypoint: /bin/sh
    command: -ec 'terraform init -input=false && terraform apply -input=false -auto-approve'
    depends_on:
      floci:
        condition: service_healthy
  mysql:
    <<: *mysql
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
  mysql_test:
    <<: *mysql
    ports:
      - '13306:3306'
    volumes:
      - mysql_test_data:/var/lib/mysql

volumes:
  bundle:
  mysql_data:
  mysql_test_data:
