version: '4'

interaction:
  terraform:
    service: terraform
    command: ""
    compose:
      run_options: [no-deps, entrypoint=terraform]
  bash:
    service: rails
    command: bash
  bundle:
    service: rails
    command: bundle
  rails:
    service: rails
    command: bundle exec rails
    subcommands:
      s:
        command: bundle exec rails s -b 0.0.0.0
        compose:
          run_options: [service-ports]
  rspec:
    service: rails
    command: bundle exec rspec
  importmap:
    service: rails
    command: bin/importmap

provision:
  - dip bundle install
  - dip rails db:migrate
  - dip rails db:migrate RAILS_ENV=test
