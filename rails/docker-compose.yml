services:
  rails:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp:1.0.1
    tty: true
    stdin_open: true
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    networks:
      default:
        aliases:
          - localhost.floci.io
